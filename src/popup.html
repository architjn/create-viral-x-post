<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Viral X Post</title>
    <style>
        body {
            width: 375px; /* Typical mobile width, adjust as needed */
            font-family: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #e7e9ea;
            margin: 0; /* Remove default body margin */
            font-size: 15px; /* Base font size */
        }
        .composer {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .composer-top {
            display: flex;
            gap: 12px;
        }
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #333639; /* Placeholder color */
            flex-shrink: 0;
        }
        .input-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        textarea {
            width: 100%;
            min-height: 70px; /* Minimum height, expands */
            box-sizing: border-box;
            padding: 10px 0; /* Only vertical padding */
            border: none; /* Remove border */
            resize: none; /* Disable manual resize */
            font-size: 1.2em; /* Larger font size like X */
            background-color: transparent; /* Transparent background */
            color: #e7e9ea;
            font-family: inherit;
            outline: none; /* Remove focus outline */
            overflow-y: auto; /* Allow scrolling if content exceeds height */
        }
        textarea::placeholder {
            color: #71767b;
            font-size: 1.2em;
            font-weight: 400;
        }
        .reply-setting {
            color: #1d9bf0; /* X.com blue */
            font-size: 0.9em;
            font-weight: 700;
            padding: 4px 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 9999px;
            align-self: flex-start; /* Align to the left */
            /* Optional: Add hover effect */
            /* &:hover { background-color: rgba(29, 155, 240, 0.1); } */
        }
        .divider {
            border: none;
            height: 1px;
            background-color: #2f3336; /* X.com divider color */
            margin: 4px 0;
        }
        .composer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }
        .action-icons {
            display: flex;
            gap: 10px;
            color: #1d9bf0; /* Icon color */
            font-size: 1.2em; /* Adjust icon size if using text/emoji */
        }
        /* Placeholder for icons */
        .action-icons span {
             cursor: pointer;
        }
        button#submitButton {
            padding: 8px 16px; /* Slightly smaller padding */
            background-color: #1d9bf0;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 0.95em; /* Slightly smaller font */
            font-weight: 700;
            transition: background-color 0.2s ease;
            /* align-self: flex-end; No longer needed here */
        }
        button#submitButton:hover {
            background-color: #1a8cd8;
        }
        /* Optional: Dim button when disabled */
        button#submitButton:disabled {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="composer">
        <div class="composer-top">
            <div class="profile-pic"></div>
            <div class="input-area">
                <textarea id="postTextArea" placeholder="What's happening?!"></textarea>
            </div>
        </div>
        <hr class="divider">
        <div class="composer-bottom">
            <div class="action-icons">

            </div>
            <button id="submitButton">Enhance</button>
        </div>
    </div>
    <!-- Optional: Add script tag for interactivity later -->
    <script src="popup.js"></script>
</body>
</html>
